aid: dcvc
name: DCVC (Data Collective)
description: >-
  DCVC (Data Collective) is a deep-tech venture capital firm founded in 2011 and headquartered in
  Palo Alto and San Francisco, California. Founded and led by managing partners Matt Ocko and Zachary
  Bogue, DCVC backs entrepreneurs using computational and AI-driven approaches to solve trillion-dollar
  problems in the real world across sectors that have often seen little material progress in decades.
  The firm invests from early through growth stages across AI, compute and quantum, computational
  biology and chemistry, cybersecurity and defense, energy and climate, finance and insurance,
  industrial transformation and advanced manufacturing, next-gen agriculture, space, TechBio and
  TechMed. Across 13+ funds DCVC manages roughly $4B in assets under management (self-reported / press),
  making it one of the larger dedicated deep-tech franchises. Notable portfolio outcomes include
  companies spanning fusion energy, carbon transformation, robotics, drug discovery, and data
  infrastructure.
